name: Plugin tests

on:
  push:
    paths:
      - "manimlib/ai/**"
      - "manimlib/code_checker/**"
      - "manimlib/gui/**"
      - "generator/**"
      - "tests/test_ai_plugins.py"
      - "tests/test_config_import.py"
      - "manimlib/config.py"
      - "setup.cfg"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "manimlib/ai/**"
      - "manimlib/code_checker/**"
      - "manimlib/gui/**"
      - "generator/**"
      - "tests/test_ai_plugins.py"
      - "tests/test_config_import.py"
      - "manimlib/config.py"
      - "setup.cfg"
      - ".github/workflows/plugin-tests.yml"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and GUI dependencies
        run: python -m pip install -e ".[gui]"

      - name: Run plugin tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile plugin packages
        run: python -m compileall -q manimlib/ai manimlib/code_checker manimlib/gui generator
